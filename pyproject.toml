[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyasset"
version = "0.1.0"
description = "Reproducible shared development assets for Anygine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
assetctl = "anyasset.cli:main"

[tool.setuptools.packages.find]
include = ["anyasset*"]
